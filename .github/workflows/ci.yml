name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install pyyaml
      - run: python scripts/check_slice1.py
      - run: python scripts/check_slice2.py
      - run: python scripts/check_slice3.py
  python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [recorder-service, code-generator-service, runner-service]
    defaults: {run: {working-directory: "services/${{ matrix.service }}"}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install pytest httpx fastapi pydantic
      - run: python -m pytest -q
  control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: automation
          POSTGRES_USER: automation
          POSTGRES_PASSWORD: automation-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U automation -d automation"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults: {run: {working-directory: services/control-plane}}
    env:
      SPRING_PROFILES_ACTIVE: dev
      PLATFORM_ENV: local
      POSTGRES_USER: automation
      POSTGRES_PASSWORD: automation-ci
      DATABASE_URL: jdbc:postgresql://localhost:5432/automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25', cache: maven}
      - run: mvn -B test
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: 'npm'}
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
