name: slice1-ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install pyyaml
      - run: python scripts/check_slice1.py
  control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: automation
          POSTGRES_USER: automation
          POSTGRES_PASSWORD: automation-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U automation -d automation"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults: {run: {working-directory: services/control-plane}}
    env:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_USER: automation
      POSTGRES_PASSWORD: automation-ci
      DATABASE_URL: jdbc:postgresql://localhost:5432/automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25', cache: maven}
      - run: mvn -B test
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  recorder:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/recorder-service}}
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  code-generator:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/code-generator-service}}
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  runner:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/runner-service}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.runtime.example .env.runtime
      - run: docker compose config --quiet
