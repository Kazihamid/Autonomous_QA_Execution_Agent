name: handover-package

on:
  push:
    branches:
      - chore/fresh-clone-smoke

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Claude handover
        shell: bash
        run: |
          cat > CLAUDE_HANDOVER.md <<'EOF'
          # Autonomous QA Execution Agent — Claude Handover

          ## Source
          Repository: Kazihamid/Autonomous_QA_Execution_Agent
          Branch packaged: chore/fresh-clone-smoke
          Product version: 0.3.2

          ## Objective
          Docker-first autonomous QA platform supporting recording, Automation IR, scenario repository, code generation, and execution.

          ## Core services
          - Web: Next.js / React / TypeScript
          - Control Plane: Java / Spring Boot / JPA / Flyway
          - PostgreSQL
          - Recorder: Python / FastAPI / Chromium / noVNC
          - Code Generator: Python / FastAPI
          - Runner: Python / Playwright / Pytest

          ## Start
          Windows:
          1. Start Docker Desktop.
          2. Run START_PROJECT.bat.
          3. Open http://localhost:3000

          The startup script creates .env.runtime from .env.runtime.example if missing.
          Configure local secrets there when required. Never commit real secrets.

          ## Current validated portability work
          - Compose-managed PostgreSQL volume for fresh clones
          - .env.runtime first-start bootstrap
          - package-lock.json committed
          - Web Docker build and CI use npm ci
          - DB backup/restore scripts included
          - CI covers Web, Control Plane, Recorder, Code Generator, Runner compile, Compose config
          - Full fresh-clone Docker smoke test passed on this branch

          ## Important runtime behavior
          - Existing workspaces/scenarios are PostgreSQL data and are not stored in Git.
          - Use scripts/backup-db.ps1 and scripts/restore-db.ps1 to move runtime DB data.
          - Protected QA targets may require VPN/organization-network access.

          ## Security / packaging
          This handover package intentionally excludes:
          - .git
          - .env.runtime and other local secret files
          - node_modules
          - .next
          - Maven target
          - __pycache__
          - .pytest_cache
          - runtime-artifacts
          - database contents
          - local backups / ZIPs

          ## Recent known application-level observations
          - Dynamic ERP autocomplete requires real key events; generator uses sequential typing for those fields.
          - DataTables employee search can fail because recorded employee IDs may no longer exist in the current dataset; this should be treated as test-data mismatch, not only locator failure.
          - Runtime payload override/editing and live execution visualization were planned but were not yet completed.
          - Do not invent or submit destructive ERP business data such as separation dates unless explicitly authorized.
          EOF

      - name: Build source handover zip
        shell: bash
        run: |
          zip -r Autonomous_QA_Execution_Agent_Claude_Handover_0.3.2.zip .             -x ".git/*"                ".env" ".env.local" ".env.runtime"                "node_modules/*" "*/node_modules/*"                ".next/*" "*/.next/*"                "target/*" "*/target/*"                "__pycache__/*" "*/__pycache__/*"                ".pytest_cache/*" "*/.pytest_cache/*"                "runtime-artifacts/*" "*/runtime-artifacts/*"                "backups/*" "*/backups/*"                "*.sql" "*.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Autonomous_QA_Execution_Agent_Claude_Handover_0.3.2
          path: Autonomous_QA_Execution_Agent_Claude_Handover_0.3.2.zip
          if-no-files-found: error
