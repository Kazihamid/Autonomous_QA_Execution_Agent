name: autonomous_qa_execution_agent

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: automation
      POSTGRES_USER: automation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-password}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automation -d automation"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql

  recorder:
    build:
      context: ./services/recorder-service
      dockerfile: Dockerfile
    environment:
      RECORDER_CHROMIUM_PATH: /usr/bin/chromium
      DISPLAY: :99
    ports:
      - "127.0.0.1:8090:8090"
      - "127.0.0.1:6080:6080"
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  code-generator:
    build:
      context: ./services/code-generator-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  runner:
    build:
      context: ./services/runner-service
      dockerfile: Dockerfile
    volumes:
      # The single .env file also holds the test passwords. It is read again on every run, so a changed password
      # takes effect without restarting the runner.
      - type: bind
        source: ./.env
        target: /run/runtime/.env
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8110:8110"
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8110/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  control-plane:
    build:
      context: ./services/control-plane
      dockerfile: Dockerfile
    environment:
      SCENARIO_BACKUP_DIR: /backups
      SPRING_PROFILES_ACTIVE: dev
      PLATFORM_ENV: local
      CONTROL_PLANE_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/automation
      POSTGRES_USER: automation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-password}
      PLATFORM_ALLOW_PRIVATE_TARGETS: "${PLATFORM_ALLOW_PRIVATE_TARGETS:-false}"
      PLATFORM_ALLOWED_TARGET_HOSTS: ""
      RECORDER_SERVICE_URL: http://recorder:8090
      CODE_GENERATOR_SERVICE_URL: http://code-generator:8100
      RUNNER_SERVICE_URL: http://runner:8110
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # A fresh copy of every scenario is written here after each change, so scenarios survive a lost database.
      - ./scenario-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      recorder:
        condition: service_healthy
      code-generator:
        condition: service_healthy
      runner:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CONTROL_PLANE_URL: http://localhost:8080
        NEXT_PUBLIC_AUTH_MODE: dev
        NEXT_PUBLIC_RECORDER_VIEW_URL: "http://localhost:6080/vnc.html?autoconnect=1&resize=scale"
    environment:
      NEXT_PUBLIC_CONTROL_PLANE_URL: http://localhost:8080
      NEXT_PUBLIC_AUTH_MODE: dev
      NEXT_PUBLIC_RECORDER_VIEW_URL: "http://localhost:6080/vnc.html?autoconnect=1&resize=scale"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - control-plane
    restart: unless-stopped

volumes:
  postgres-data:
